<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3e8948" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Moestuintje" />
    <title>Markt · Jetskes moestuintje</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../shared/style.css" />
    <link rel="stylesheet" href="./markt.css" />
  </head>
  <body>
    <div id="app">
      <header class="markt-kop">
        <canvas id="luifel" class="sprite" aria-hidden="true"></canvas>
        <h1>Markt</h1>
        <p class="beurs" id="beurs" role="status"></p>
      </header>

      <section class="kader">
        <h2>Jouw kraam</h2>
        <ul id="kraam" class="kraam"></ul>
        <button id="allesKnop" class="knop groen breed" hidden>Verkoop alles</button>
      </section>

      <section class="kader">
        <h2>Katten</h2>
        <p class="klein-tekst">Koop een kat en hij loopt over de schutting in je moestuin.</p>
        <ul id="katten" class="katten"></ul>
      </section>

      <nav class="markt-links">
        <div id="bakkerijPlek"></div>
        <a class="knop breed" href="../">Terug naar huis</a>
      </nav>
    </div>

    <nav class="menu" aria-label="Menu" data-actief="markt" data-root="../"></nav>
    <script type="module" src="../shared/menu.js"></script>
    <script type="module" src="./markt.js"></script>
  </body>
</html>

<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3e8948" />
    <title>Plan je moestuintje</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../shared/style.css" />
    <link rel="stylesheet" href="./planner.css" />
  </head>
  <body>
    <main id="app">
      <h1 class="planner-kop">Plan je moestuintje</h1>

      <div class="gereedschap" role="toolbar" aria-label="Gereedschap">
        <button class="tool" data-tool="grond" type="button"><span class="tegel-icoon" data-g="grond"></span>Grond</button>
        <button class="tool" data-tool="pad" type="button"><span class="tegel-icoon" data-g="pad"></span>Pad</button>
        <button class="tool" data-tool="gras" type="button"><span class="tegel-icoon" data-g="gras"></span>Gras</button>
        <button class="tool" data-tool="plant" type="button" id="plant-knop"><img class="sprite" id="plant-icoon" alt="" width="24" height="24" />Plant</button>
        <button class="tool" data-tool="gum" type="button"><span class="gum-icoon" aria-hidden="true"></span>Weg</button>
        <button class="tool" data-tool="kijk" type="button"><span class="kijk-icoon" aria-hidden="true">?</span>Info</button>
      </div>

      <p class="hint" id="hint" aria-live="polite"></p>

      <div class="tuin-kader">
        <div class="tuin" id="tuin" aria-label="Jouw moestuin"></div>
      </div>

      <div class="acties">
        <button class="knop" id="ongedaan" type="button">Terug</button>
        <button class="knop" id="nu-knop" type="button">Deze maand</button>
        <button class="knop" id="maat-knop" type="button">Maat</button>
      </div>
    </main>

    <!-- Onderblad voor plantkeuze, plantinfo, maand-overzicht en tuinmaat -->
    <div class="blad-achtergrond" id="blad-achtergrond" hidden></div>
    <section class="blad kader" id="blad" role="dialog" aria-modal="true" aria-labelledby="blad-titel" hidden>
      <div class="blad-kop">
        <h2 id="blad-titel"></h2>
        <button class="sluit" id="blad-sluit" type="button" aria-label="Sluiten">X</button>
      </div>
      <div id="blad-inhoud"></div>
    </section>

    <nav class="menu" aria-label="Menu">
      <a href="../">Thuis</a>
      <a href="../spel/">Spel</a>
      <a href="./" class="actief">Moestuin</a>
    </nav>
    <script type="module" src="./planner.js"></script>
  </body>
</html>
